[build]
  base = "ntm-greenpulse-frontend"
  command = "npm run build"
  publish = "dist/ntm-greenpulse-frontend/browser"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/api/*"
  to = "https://ikhethelo-digital-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
