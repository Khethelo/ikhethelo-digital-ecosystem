openapi: 3.0.3
info:
  title: iKhethelo Digital API
  version: 1.2.0
  description: |
    Shared IKhethelo.Digital.Api HTTP contract including tenant administration.
    Reconciled with database/ikhethelo_digital_postgresql_baseline.sql.
    Names require 2-100 trimmed characters; email limit is 320. Canonical E.164
    phone validation is intentionally narrower than SQL varchar(50).
    Public alias eshlahleni resolves server-side to ESHL. No DTO accepts/returns TenantId.
    Protected routes require active identity and tenant. TenantAdmin must match the
    selected tenant; IKhetheloAdmin needs explicit CrossTenantMembership policy and
    audited tenant selection, including reads. No implicit all-tenant operations.
    Reject unknown request properties. JSON write bodies are limited to 16 KiB.
    Malformed transport and unknown properties are 400; field/business validation is 422; racing state is 409.
    TenantAdmin manages TenantAdmin and TenantStaff accounts within its assigned tenant. Internal
    administrator management requires a separate explicit AdminUserManagement tenant grant.
    All timestamps are UTC RFC3339. Lists are tenant-scoped before filtering/counting.
servers:
  - url: /
    description: Same API origin; deployment origin configured by consumers
tags:
  - name: Public membership
  - name: Authentication
  - name: Applications
  - name: Members
  - name: Administrators
  - name: Membership categories
security:
  - BearerAuth: []
paths:
  /api/v1/public/{tenantCode}/membership-applications:
    parameters:
      - $ref: '#/components/parameters/TenantCode'
    post:
      operationId: submitMembershipApplication
      tags: [Public membership]
      summary: Submit an application without an applicant account
      description: |
        Resolve active tenant server-side. Require age 18+ for ESHL on the current
        Africa/Johannesburg date; DateOnly.AddYears(18) anniversary semantics.
        Normalize email/phone. Either awaiting-registration or Active-member normalized email OR phone collision
        in this tenant returns generic 409. Create AwaitingInPersonCompletion and return only safe fields.
        No public application lookup is exposed; 201 does not imply a public GET URL.
        Registration and its audit commit before a registration-received email is attempted.
        Email failure is logged without changing the successful 201 registration result.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApplicationSubmission'}
      responses:
        '201':
          description: AwaitingInPersonCompletion application persisted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubmissionReceipt'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/v1/auth/login:
    post:
      operationId: authenticateAdministrator
      tags: [Authentication]
      summary: Authenticate an active AdminUser
      description: |
        Uses Microsoft IPasswordHasher<AdminUser>. The baseline globally constrains
        normalized administrator email. Invalid/inactive credentials return generic
        401. No refresh token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Short-lived access token; never log the response
          headers:
            Cache-Control:
              description: Always no-store
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/v1/auth/change-password:
    post:
      operationId: changeOwnAdministratorPassword
      tags: [Authentication]
      summary: Change the authenticated administrator's password and invalidate existing sessions
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangeOwnPassword'}
      responses:
        '204': {description: Password changed; authenticate again}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/v1/admin/tenants/{tenantCode}/membership-applications:
    parameters:
      - $ref: '#/components/parameters/TenantCode'
    get:
      operationId: getMembershipApplications
      tags: [Applications]
      summary: List applications in the authorized selected tenant
      description: Search names, email or phone; newest submittedAtUtc first, then id ascending. Search normalization follows MASTER_SPEC. No cross-tenant counts.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/ApplicationStatus'}
      responses:
        '200':
          description: Application page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplicationPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/v1/admin/tenants/{tenantCode}/membership-applications/{applicationId}:
    parameters:
      - $ref: '#/components/parameters/TenantCode'
      - $ref: '#/components/parameters/ApplicationId'
    get:
      operationId: getMembershipApplication
      tags: [Applications]
      summary: Inspect an application in the authorized selected tenant
      responses:
        '200':
          description: Application details without internal audit fields or review notes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Application'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/v1/admin/tenants/{tenantCode}/membership-applications/{applicationId}/activate:
    parameters:
      - $ref: '#/components/parameters/TenantCode'
      - $ref: '#/components/parameters/ApplicationId'
    post:
      operationId: activateMembership
      tags: [Applications]
      summary: Activate after the R100 membership step is completed in person
      description: |
        Check tenant and active-member identity conflicts, allocate member_number_seq,
        format ESC-xxxxx for ESHL (minimum five digits), create Member, set review
        metadata and write AuditLog in one transaction. Repeated/racing activation is 409. Email failure is logged and does not reverse activation.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewRequest'}
      responses:
        '200':
          description: Active member created, member number issued and activation email attempted after commit
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/v1/admin/tenants/{tenantCode}/members:
    parameters:
      - $ref: '#/components/parameters/TenantCode'
    post:
      operationId: registerMember
      tags: [Members]
      summary: Complete in-person membership registration with consent and a completed registration snapshot
      description: Existing online registration must use activation instead. Confirm the R100 in-person step before using this endpoint. Member creation and audits commit together; activation email is attempted after commit.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MemberRegistration'}
      responses:
        '201':
          description: Registered member
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/ServerError'}
    get:
      operationId: getMembers
      tags: [Members]
      summary: List members in the authorized selected tenant
      description: Search names, email, phone or member number; newest joinedAtUtc first, then id ascending.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/MemberStatus'}
      responses:
        '200':
          description: Member page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemberPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/v1/admin/tenants/{tenantCode}/members/{memberId}:
    parameters:
      - $ref: '#/components/parameters/TenantCode'
      - $ref: '#/components/parameters/MemberId'
    get:
      operationId: getMember
      tags: [Members]
      summary: Inspect a member in the authorized selected tenant
      responses:
        '200':
          description: Member details
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
    put:
      operationId: updateMember
      tags: [Members]
      summary: Replace allowed member name and contact details
      description: |
        All four fields required. Do not mutate source application, tenant, member
        number, birth date, joined time or status. Normalize contacts and recheck
        active-member conflicts. Mutation and required audit commit together.
        Concurrent detail edits use last committed write; activation/state conflicts are 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MemberUpdate'}
      responses:
        '200':
          description: Updated member
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/v1/admin/tenants/{tenantCode}/members/{memberId}/status:
    parameters:
      - $ref: '#/components/parameters/TenantCode'
      - $ref: '#/components/parameters/MemberId'
    put:
      operationId: updateMemberStatus
      tags: [Members]
      summary: Set an allowed member status atomically with required audit
      description: |
        Permits transitions between any declared statuses. Reactivation checks
        active-member identity conflicts. Setting current status succeeds unchanged.
        Allowed values match the baseline CHECK; transitions are application policy.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MemberStatusUpdate'}
      responses:
        '200':
          description: Member with requested status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Member'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/v1/admin-users:
    parameters:
      - $ref: '#/components/parameters/AdminTenantSelection'
    get:
      operationId: listAdministrators
      tags: [Administrators]
      summary: Search tenant administrators; internal reads are audited
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - {name: isActive, in: query, schema: {type: boolean}}
      responses:
        '200':
          description: Administrator page; Cache-Control no-store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AdminPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
    post:
      operationId: createAdministrator
      tags: [Administrators]
      summary: Create an active tenant user in the authorized tenant
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminCreate'}
      responses:
        '201': {$ref: '#/components/responses/Administrator'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/v1/admin-users/{id}:
    parameters:
      - $ref: '#/components/parameters/AdminTenantSelection'
      - $ref: '#/components/parameters/Id'
    get:
      operationId: getAdministrator
      tags: [Administrators]
      summary: View an administrator in the authorized tenant
      responses:
        '200': {$ref: '#/components/responses/Administrator'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
    put:
      operationId: updateAdministrator
      tags: [Administrators]
      summary: Replace administrator email and permitted role; invalidate existing tokens
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminUpdate'}
      responses:
        '200': {$ref: '#/components/responses/Administrator'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/v1/admin-users/{id}/status:
    parameters:
      - $ref: '#/components/parameters/AdminTenantSelection'
      - $ref: '#/components/parameters/Id'
    patch:
      operationId: setAdministratorStatus
      tags: [Administrators]
      summary: Activate or deactivate; prevent self-deactivation and removal of the last active admin
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminStatusUpdate'}
      responses:
        '200': {$ref: '#/components/responses/Administrator'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/v1/admin-users/{id}/reset-password:
    parameters:
      - $ref: '#/components/parameters/AdminTenantSelection'
      - $ref: '#/components/parameters/Id'
    post:
      operationId: resetAdministratorPassword
      tags: [Administrators]
      summary: Replace password securely and revoke all existing tokens for the target account
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminPasswordReset'}
      responses:
        '204': {description: Password reset and audit committed; no password or token returned}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/v1/admin/tenants/{tenantCode}/membership-categories:
    parameters:
      - $ref: '#/components/parameters/TenantCode'
    get:
      operationId: listMembershipCategories
      tags: [Membership categories]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - {name: status, in: query, schema: {type: string, enum: [Active, Inactive]}}
      responses:
        '200':
          description: Category page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CategoryPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
    post:
      operationId: createMembershipCategory
      tags: [Membership categories]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CategoryWrite'}
      responses:
        '201': {$ref: '#/components/responses/Category'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/v1/admin/tenants/{tenantCode}/membership-categories/{id}:
    parameters:
      - $ref: '#/components/parameters/TenantCode'
      - $ref: '#/components/parameters/Id'
    put:
      operationId: updateMembershipCategory
      tags: [Membership categories]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CategoryWrite'}
      responses:
        '200': {$ref: '#/components/responses/Category'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/v1/admin/tenants/{tenantCode}/members/{memberId}/category:
    parameters:
      - $ref: '#/components/parameters/TenantCode'
      - $ref: '#/components/parameters/MemberId'
    get:
      operationId: getMemberCategory
      tags: [Members]
      responses:
        '200': {$ref: '#/components/responses/MemberCategory'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
    put:
      operationId: setMemberCategory
      tags: [Members]
      summary: Assign an active tenant category or null to remove the assignment
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MemberCategoryUpdate'}
      responses:
        '200': {$ref: '#/components/responses/MemberCategory'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMedia'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/v1/admin/tenants/{tenantCode}/members/{memberId}/history:
    parameters:
      - $ref: '#/components/parameters/TenantCode'
      - $ref: '#/components/parameters/MemberId'
    get:
      operationId: getMemberHistory
      tags: [Members]
      summary: Paginated registration and change audit history; newest first
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Safe member history page; legacy events may have no before/after metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemberHistoryPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/ServerError'}
  /api/v1/admin/tenants/{tenantCode}/ntm/veterans: {
        "parameters":  [
                           {
                               "$ref":  "#/components/parameters/TenantCode"
                           }
                       ],
        "get":  {
                    "tags":  [
                                 "NTM GreenPulse"
                             ],
                    "operationId":  "ntmgetVeteranCollection",
                    "description":  "Verified workbook mapping. Requires enabled tenant, active administrator and NtmAccess; internal access needs separate CrossTenantNtm grant.",
                    "responses":  {
                                      "200":  {
                                                  "content":  {
                                                                  "application/json":  {
                                                                                           "schema":  {
                                                                                                          "$ref":  "#/components/schemas/NtmVeteranPage"
                                                                                                      }
                                                                                       }
                                                              },
                                                  "description":  "Success"
                                              },
                                      "400":  {
                                                  "$ref":  "#/components/responses/BadRequest"
                                              },
                                      "401":  {
                                                  "$ref":  "#/components/responses/Unauthorized"
                                              },
                                      "403":  {
                                                  "$ref":  "#/components/responses/Forbidden"
                                              },
                                      "404":  {
                                                  "$ref":  "#/components/responses/NotFound"
                                              },
                                      "409":  {
                                                  "$ref":  "#/components/responses/Conflict"
                                              },
                                      "413":  {
                                                  "$ref":  "#/components/responses/TooLarge"
                                              },
                                      "415":  {
                                                  "$ref":  "#/components/responses/UnsupportedMedia"
                                              },
                                      "422":  {
                                                  "$ref":  "#/components/responses/ValidationFailed"
                                              },
                                      "500":  {
                                                  "$ref":  "#/components/responses/ServerError"
                                              }
                                  },
                    "parameters":  [
