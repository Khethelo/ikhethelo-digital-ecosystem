        firstName: {$ref: '#/components/schemas/Name'}
        lastName: {$ref: '#/components/schemas/Name'}
        dateOfBirth: {type: string, format: date}
        phoneNumber: {$ref: '#/components/schemas/Phone'}
        email: {$ref: '#/components/schemas/Email'}
        termsAccepted: {type: boolean, enum: [true]}
        privacyConsent: {type: boolean, enum: [true]}
        categoryId: {type: string, format: uuid, nullable: true}
    CategoryWrite:
      type: object
      additionalProperties: false
      required: [name, isActive]
      properties:
        name: {type: string, minLength: 2, maxLength: 100}
        isActive: {type: boolean}
    MembershipCategory:
      type: object
      required: [id, name, isActive]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        isActive: {type: boolean}
    CategoryPage:
      type: object
      required: [items, page, pageSize, totalCount]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/MembershipCategory'}}
        page: {type: integer}
        pageSize: {type: integer}
        totalCount: {type: integer, format: int64}
    MemberCategoryUpdate:
      type: object
      additionalProperties: false
      properties:
        categoryId: {type: string, format: uuid, nullable: true}
    MemberCategory:
      type: object
      required: [memberId]
      properties:
        memberId: {type: string, format: uuid}
        categoryId: {type: string, format: uuid, nullable: true}
        categoryName: {type: string, nullable: true}
    MemberHistoryEntry:
      type: object
      required: [id, action, createdAtUtc]
      properties:
        id: {type: string, format: uuid}
        action: {type: string}
        actorAdminUserId: {type: string, format: uuid, nullable: true}
        createdAtUtc: {type: string, format: date-time}
        previousStatus: {type: string, nullable: true}
        status: {type: string, nullable: true}
        previousCategoryId: {type: string, format: uuid, nullable: true}
        categoryId: {type: string, format: uuid, nullable: true}
    MemberHistoryPage:
      type: object
      required: [items, page, pageSize, totalCount]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/MemberHistoryEntry'}}
        page: {type: integer}
        pageSize: {type: integer}
        totalCount: {type: integer, format: int64}
    Name:
      type: string
      minLength: 2
      maxLength: 100
      pattern: '^\S(?:[\s\S]*\S)$'
      description: Trim before validation/storage; require 2-100 trimmed characters. Preserve Unicode names and punctuation.
    Email:
      type: string
      format: email
      minLength: 3
      maxLength: 320
      description: Trim; invariant uppercase for normalized comparison. Matches baseline varchar(320); normalized value must also fit.
    Phone:
      type: string
      pattern: '^\+[1-9][0-9]{7,14}$'
      maxLength: 16
      description: Canonical international E.164 representation; no spaces.
    ApplicationStatus:
      type: string
      enum: [AwaitingInPersonCompletion, Completed, LegacyClosed]
      description: LegacyClosed is read-only historical data. New registrations await in-person completion; activation marks them Completed.
    MemberStatus:
      type: string
      enum: [Active, Suspended, Inactive]
      description: Matches ck_members_status. Newly activated members are Active.
    ApplicationSubmission:
      type: object
      additionalProperties: false
      required: [firstName, lastName, dateOfBirth, phoneNumber, email, termsAccepted, privacyConsent]
      properties:
        firstName: {$ref: '#/components/schemas/Name'}
        lastName: {$ref: '#/components/schemas/Name'}
        dateOfBirth:
          type: string
          format: date
          description: Real calendar date, not future; ESHL 18+ validation is server authoritative.
        phoneNumber: {$ref: '#/components/schemas/Phone'}
        email: {$ref: '#/components/schemas/Email'}
        termsAccepted: {type: boolean, enum: [true]}
        privacyConsent: {type: boolean, enum: [true]}
    SubmissionReceipt:
      type: object
      additionalProperties: false
      required: [applicationId, status, submittedAtUtc, message]
      properties:
        applicationId: {type: string, format: uuid}
        status: {type: string, enum: [AwaitingInPersonCompletion]}
        submittedAtUtc: {type: string, format: date-time}
        message: {type: string, example: Your registration has been received.}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {$ref: '#/components/schemas/Email'}
        password: {type: string, format: password, minLength: 1, maxLength: 1024, writeOnly: true}
    TokenResponse:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken: {type: string, description: Sensitive signed JWT. Never log.}
        tokenType: {type: string, enum: [Bearer]}
        expiresIn: {type: integer, enum: [1800], description: Seconds until access token expiry.}
    ReviewRequest:
      type: object
      additionalProperties: false
      properties:
        reviewNotes: {type: string, minLength: 1, maxLength: 2000, description: Optional internal review input; omit when absent. Not returned in response DTOs.}
    Application:
      type: object
      additionalProperties: false
      required: [applicationId, firstName, lastName, dateOfBirth, phoneNumber, email, termsAccepted, privacyConsent, status, submittedAtUtc]
      properties:
        applicationId: {type: string, format: uuid}
        firstName: {$ref: '#/components/schemas/Name'}
        lastName: {$ref: '#/components/schemas/Name'}
        dateOfBirth: {type: string, format: date}
        phoneNumber: {$ref: '#/components/schemas/Phone'}
        email: {$ref: '#/components/schemas/Email'}
        termsAccepted: {type: boolean, enum: [true]}
        privacyConsent: {type: boolean, enum: [true]}
        status: {$ref: '#/components/schemas/ApplicationStatus'}
        submittedAtUtc: {type: string, format: date-time}
    MemberUpdate:
      type: object
      additionalProperties: false
      required: [firstName, lastName, phoneNumber, email]
      properties:
        firstName: {$ref: '#/components/schemas/Name'}
        lastName: {$ref: '#/components/schemas/Name'}
        phoneNumber: {$ref: '#/components/schemas/Phone'}
        email: {$ref: '#/components/schemas/Email'}
    MemberStatusUpdate:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {$ref: '#/components/schemas/MemberStatus'}
    Member:
      type: object
      additionalProperties: false
      description: Member detail projection from baseline fields; excludes internal tenant, normalized contact and audit fields.
      required: [memberId, applicationId, memberNumber, firstName, lastName, dateOfBirth, phoneNumber, email, status, joinedAtUtc]
      properties:
        memberId: {type: string, format: uuid}
        applicationId: {type: string, format: uuid}
        memberNumber: {type: string, example: ESC-00001}
        firstName: {$ref: '#/components/schemas/Name'}
        lastName: {$ref: '#/components/schemas/Name'}
        dateOfBirth: {type: string, format: date}
        phoneNumber: {$ref: '#/components/schemas/Phone'}
        email: {$ref: '#/components/schemas/Email'}
        status: {$ref: '#/components/schemas/MemberStatus'}
        joinedAtUtc: {type: string, format: date-time}
    ApplicationPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, totalCount]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Application'}}
        page: {type: integer, minimum: 1}
        pageSize: {type: integer, minimum: 1, maximum: 100}
        totalCount: {type: integer, format: int64, minimum: 0}
    MemberPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, totalCount]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Member'}}
        page: {type: integer, minimum: 1}
        pageSize: {type: integer, minimum: 1, maximum: 100}
        totalCount: {type: integer, format: int64, minimum: 0}
    ProblemDetails:
      type: object
      required: [type, title, status]
      description: Safe RFC Problem Details; extensions must not disclose secrets, PII or internal exceptions.
      properties:
        type: {type: string, format: uri, example: 'about:blank'}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        instance: {type: string, description: Safe request path or opaque occurrence reference.}
        traceId: {type: string, description: Opaque support correlation identifier.}
    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              description: CamelCase DTO field names mapped to safe validation messages; use request for a whole-body issue.
              additionalProperties:
                type: array
                items: {type: string}
  responses:
    Administrator:
      description: Safe administrator details; Cache-Control no-store; never includes hashes, passwords or tenant IDs
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Administrator'}
    Category:
      description: Membership category
      content:
        application/json:
          schema: {$ref: '#/components/schemas/MembershipCategory'}
    MemberCategory:
      description: Current membership category assignment
      content:
        application/json:
          schema: {$ref: '#/components/schemas/MemberCategory'}
    BadRequest:
      description: Malformed JSON, type, path or query syntax
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    Unauthorized:
      description: Missing/invalid/expired token, or invalid/inactive login credentials
      headers:
        WWW-Authenticate:
          description: Bearer challenge on protected routes
          schema: {type: string}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    Forbidden:
      description: Authenticated identity lacks required role/policy or selected tenant access
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    NotFound:
      description: Unknown/inactive tenant or resource absent from authorized tenant scope
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    Conflict:
      description: Generic duplicate, active-member identity conflict or incompatible/concurrent business state
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    TooLarge:
      description: JSON body exceeds 16 KiB
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    UnsupportedMedia:
      description: Write body must use application/json
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    ValidationFailed:
      description: Parsed request fails required fields, lengths, formats, consent, date, age or business validation
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ValidationProblemDetails'}
    RateLimited:
      description: Public submission or login rate limit exceeded
      headers:
        Retry-After:
          description: Seconds until retry is allowed
          schema: {type: integer, minimum: 1}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
    ServerError:
      description: Safe unexpected failure; no internal details
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/ProblemDetails'}
