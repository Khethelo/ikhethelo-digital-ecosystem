    AdminCreate:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {$ref: '#/components/schemas/Email'}
        password: {type: string, minLength: 8, maxLength: 128, writeOnly: true, description: 'Must contain an ASCII digit and a character that is not a Unicode letter, number or whitespace.'}
        role: {type: string, enum: [TenantAdmin, TenantStaff], default: TenantStaff}
    AdminUpdate:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: {$ref: '#/components/schemas/Email'}
        role: {type: string, enum: [TenantAdmin, TenantStaff]}
    AdminStatusUpdate:
      type: object
      additionalProperties: false
      required: [isActive]
      properties:
        isActive: {type: boolean}
    AdminPasswordReset:
      type: object
      additionalProperties: false
      required: [newPassword]
      properties:
        newPassword: {type: string, minLength: 8, maxLength: 128, writeOnly: true, description: 'Must contain an ASCII digit and a character that is not a Unicode letter, number or whitespace.'}
    ChangeOwnPassword:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword, confirmPassword]
      properties:
        currentPassword: {type: string, maxLength: 1024, writeOnly: true}
        newPassword: {type: string, minLength: 8, maxLength: 128, writeOnly: true, description: 'Must contain an ASCII digit and a character that is not a Unicode letter, number or whitespace.'}
        confirmPassword: {type: string, minLength: 8, maxLength: 128, writeOnly: true}
    Administrator:
      type: object
      additionalProperties: false
      required: [id, email, role, isActive, createdAtUtc, updatedAtUtc]
      properties:
        id: {type: string, format: uuid}
        email: {$ref: '#/components/schemas/Email'}
        role: {type: string, enum: [TenantAdmin, TenantStaff]}
        isActive: {type: boolean}
        createdAtUtc: {type: string, format: date-time}
        updatedAtUtc: {type: string, format: date-time}
        lastLoginAtUtc: {type: string, format: date-time, nullable: true}
    AdminPage:
      type: object
      required: [items, page, pageSize, totalCount]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Administrator'}}
        page: {type: integer}
        pageSize: {type: integer}
        totalCount: {type: integer, format: int64}
    MemberRegistration:
      type: object
