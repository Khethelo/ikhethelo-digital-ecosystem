components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Validated AdminUser JWT; enforce role, active tenant and explicit tenant authorization policies.
  parameters:
    AdminTenantSelection:
      name: tenantCode
      in: query
      description: Optional for TenantAdmin (defaults to assigned tenant); required for internal admins with an explicit AdminUserManagement grant.
      schema: {type: string, maxLength: 50, example: ESHL}
    Id:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    TenantCode:
      name: tenantCode
      in: path
      required: true
      description: Public requests require a configured alias (eshlahleni maps to ESHL). Administrative routes also accept canonical tenant codes such as ESHL. Never an internal UUID or authorization grant.
      schema: {type: string, pattern: '^[A-Za-z][A-Za-z0-9-]{0,49}$', example: eshlahleni}
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema: {type: string, format: uuid}
    MemberId:
      name: memberId
      in: path
      required: true
      schema: {type: string, format: uuid}
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1, maximum: 2147483647}
    PageSize:
      name: pageSize
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    Search:
      name: search
      in: query
      description: Trimmed case-insensitive literal substring; no regex/wildcards. Empty means no search. Contact search uses canonical normalization where applicable.
      schema: {type: string, maxLength: 320}
  schemas:
    NtmVeteranWrite: {
          "additionalProperties":  false,
          "properties":  {
                             "fullName":  {
                                              "type":  "string",
                                              "maxLength":  200
                                          },
                             "mkmvaNumber":  {
                                                 "type":  "string",
                                                 "maxLength":  100,
                                                 "nullable":  true
                                             },
                             "dmvNumber":  {
                                               "type":  "string",
                                               "maxLength":  100,
                                               "nullable":  true
                                           },
                             "contactNumber":  {
                                                   "type":  "string",
                                                   "maxLength":  50,
                                                   "nullable":  true
                                               },
                             "emailAddress":  {
                                                  "type":  "string",
                                                  "maxLength":  320,
                                                  "nullable":  true
                                              },
                             "membershipReference":  {
                                                         "type":  "string",
                                                         "maxLength":  100,
                                                         "nullable":  true
                                                     }
                         },
          "description":  "Verified workbook representation; source anomalies remain separate from validated values. At least one nonblank MKMVA or DMV number is required; each is case-insensitively unique per tenant.",
          "type":  "object",
          "required":  [
                           "fullName"
                       ]
      }
    NtmBusinessWrite: {
          "additionalProperties":  false,
          "properties":  {
                             "veteranId":  {
                                               "type":  "string",
                                               "format":  "uuid"
                                           },
                             "businessName":  {
                                                  "type":  "string",
                                                  "maxLength":  200
                                              },
                             "cipcRegistrationNumber":  {
                                                            "type":  "string",
                                                            "maxLength":  100,
                                                            "nullable":  true
                                                        },
                             "businessAddress":  {
                                                     "type":  "string",
                                                     "nullable":  true
                                                 },
                             "sector":  {
                                            "type":  "string",
                                            "maxLength":  200,
                                            "nullable":  true
